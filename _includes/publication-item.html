<div class="publication-item">
  <div class="publication-title">
    <a href="{{ include.url }}">{{ include.title }}</a>
  </div>
  <div class="publication-authors">{{ include.authors }}</div>
  <div class="publication-links">
    {% include button.html text="Paper" link=include.paper_url color="#0366d6" %}
    {% include button.html text="Huggingface" link=include.huggingface_url color="#0366d6" %}
    {% include button.html text="Code" link=include.code_url color="#0366d6" %}
  </div>
</div>
